name: Django CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_TEST_SQLITE: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CHANNEL_REDIS_HOST: 127.0.0.1
      CHANNEL_REDIS_PORT: "6379"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            TicketProject/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install "pip==24.0" "setuptools<58" wheel
          pip install --no-build-isolation -r TicketProject/requirements.txt
          pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint critical Python errors
        run: flake8 TicketProject --count

      - name: Check Django configuration
        working-directory: TicketProject
        run: python manage.py check --settings=TicketProject.settings.local

      - name: Run automated tests
        working-directory: TicketProject
        run: python manage.py test user_management --settings=TicketProject.settings.local
